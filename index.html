<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astro Arcade</title>
<style>
body{margin:0;background:#0a0a1a;color:#eee;font:16px monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;justify-content:center}
h1{margin:8px;color:#ffd23f;text-shadow:0 0 12px #ff4d6d;letter-spacing:4px}
canvas{background:radial-gradient(#1b1b4a,#05050f);border:3px solid #6c5ce7;box-shadow:0 0 30px #6c5ce7;max-width:100vw;max-height:80vh}
p{opacity:.7}
#hs{width:480px;max-width:94vw;margin:14px 0;border:2px solid #6c5ce7;box-shadow:0 0 20px #6c5ce755;padding:10px 14px;background:#0d0d26}
#hs h2{margin:0 0 8px;color:#ffd23f;text-align:center;letter-spacing:3px;font-size:18px}
#hs table{width:100%;border-collapse:collapse}#hs td{padding:2px 4px}#hs td:last-child{text-align:right}
#hs tr.me{color:#00e5ff;font-weight:bold}#hs .row{display:flex;gap:8px;margin-bottom:8px}
#hs input{flex:1;background:#05050f;color:#fff;border:1px solid #6c5ce7;padding:6px;font:inherit}
#hs button{background:#6c5ce7;color:#fff;border:0;padding:6px 10px;font:inherit;cursor:pointer}
#fx{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;pointer-events:none;z-index:99;background:none;border:0;box-shadow:none}
#boss{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;z-index:98;display:none;gap:8px;background:#1a0010ee;border:2px solid #ff4d6d;padding:8px;box-shadow:0 0 24px #ff4d6d}
#boss button{background:#2a0a20;color:#fff;border:1px solid #ff4d6d;padding:6px 8px;font:inherit;cursor:pointer;position:relative;overflow:hidden;min-width:96px}
#boss button i{position:absolute;left:0;bottom:0;height:4px;background:#ffd23f;width:0}
#boss.on{display:flex}
body.bossmode{animation:bg 0.6s infinite alternate}@keyframes bg{to{background:#25051a}}
#defi{color:#ff9f43;text-align:center;margin:6px 0;display:none}
</style></head><body>
<h1>ASTRO ARCADE</h1>
<canvas id="c" width="480" height="640"></canvas>
<p id="demo" style="display:none;color:#00e5ff;opacity:1;margin:4px">🤖 MODE DÉMO — l'IA joue (window.setAutoplay(false) pour reprendre)</p>
<p>← → / Q D : bouger · Espace : tirer · Entrée : (re)lancer · tactile : glisser · <small>↑↑↓↓←→←→BA ?</small> · <a href="versus.html" style="color:#ff4d6d">⚔ Mode 2 joueurs</a></p>
<section id="hs">
<h2>🏆 CLASSEMENT</h2>
<div id="defi"></div>
<div class="row"><input id="pseudo" maxlength="12" placeholder="Ton pseudo" autocomplete="off"><button id="share">Défier un ami</button></div>
<table id="board"></table>
</section>
<div id="boss"></div>
<canvas id="fx"></canvas>
<script src="logic.js"></script>
<script src="boss.js"></script>
<script src="ai.js"></script>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const keys = {}; let s = Logic.newState(), running = false, last = 0;
let best = +(localStorage.getItem('astro-best') || 0);
const stars = Array.from({length: 60}, () => ({x: Math.random()*480, y: Math.random()*640, v: 20+Math.random()*80}));
const fxCv = document.getElementById('fx'), fg = fxCv.getContext('2d'), fx = Logic.newFx();
let prevLevel = 1, runBase = best, recordFired = false;
function fxResize() { fxCv.width = innerWidth; fxCv.height = innerHeight; }
addEventListener('resize', fxResize); fxResize();
function celebrate(k) { Logic.celebrate(fx, k, fxCv.width, fxCv.height); }
function drawFx() {
  fg.clearRect(0, 0, fxCv.width, fxCv.height);
  if (fx.flash > 0) { fg.fillStyle = `rgba(255,235,160,${fx.flash * 0.35})`; fg.fillRect(0, 0, fxCv.width, fxCv.height); }
  fg.globalCompositeOperation = 'lighter';
  fx.sparks.forEach(p => { fg.globalAlpha = Math.max(0, Math.min(1, p.life / 0.8)); fg.fillStyle = p.color; fg.fillRect(p.x - 2.5, p.y - 2.5, 5, 5); });
  fx.rockets.forEach(r => { fg.globalAlpha = 1; fg.fillStyle = '#fff'; fg.fillRect(r.x - 2, r.y, 4, 14); });
  fg.globalCompositeOperation = 'source-over'; fg.shadowBlur = 0; fg.globalAlpha = 1;
  fx.confetti.forEach(c => { fg.save(); fg.translate(c.x, c.y); fg.rotate(c.rot); fg.scale(1, Math.cos(c.rot * 2)); fg.fillStyle = c.color; fg.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2); fg.restore(); });
}
// --- Mode Boss Secret : Konami Code -> boss géant, le chat vote ses attaques ---
let boss = null; const konami = Boss.konamiTracker();
let actx = null;
function beep(freq, dur, type, vol, slide) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), v = actx.createGain(), t = actx.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    v.gain.setValueAtTime(vol || 0.05, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(v); v.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function jingle(notes) { notes.forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.05), i * 110)); }
const SFX = {
  start: () => jingle([262, 330, 392, 523, 392, 523, 659, 784]),
  shoot: () => beep(880, 0.08, 'square', 0.025, 300),
  'boss-hit': () => beep(160, 0.1, 'sawtooth', 0.05, 60),
  hit: () => beep(220, 0.35, 'sawtooth', 0.08, 40),
  laser: () => beep(1200, 0.5, 'square', 0.04, 90),
  attack: () => { beep(110, 0.4, 'sawtooth', 0.07, 55); setTimeout(() => beep(98, 0.4, 'sawtooth', 0.07, 49), 150); },
  'vote-start': () => jingle([523, 659]),
  vote: () => beep(990, 0.05, 'triangle', 0.05),
  win: () => jingle([523, 659, 784, 1047, 784, 1047, 1319, 1568]),
};
const bossEl = document.getElementById('boss');
function buildBossUi() {
  bossEl.innerHTML = Boss.ATTACKS.map((a, i) => `<button data-k="${a.key}">${i + 1}. ${a.emoji} ${a.label}<br><small class="n">0</small><i></i></button>`).join('');
  bossEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => vote(b.dataset.k, 'toi')));
}
buildBossUi();
function vote(k, who) { if (boss && Boss.castVote(boss, k, who)) SFX.vote(); }
// Faux "chat Twitch" : des spectateurs virtuels votent en direct (le vrai chat peut aussi cliquer / taper 1-4).
const FAKE_VIEWERS = ['kevin_42', 'LaMouette', 'xX_Pixel_Xx', 'Zoé', 'MrBaguette', 'Tonton_Dev', 'neko', 'GigaChad', 'Lulu', 'ArcadeFan'];
const FAKE_MSGS = ['!laser', '!pluie', '!spirale', '!chaos', '!chaos', '!laser'];
setInterval(() => {
  if (!boss || boss.defeated || boss.phase !== 'vote') return;
  const who = FAKE_VIEWERS[Math.floor(Math.random() * FAKE_VIEWERS.length)];
  const k = Boss.parseVote(FAKE_MSGS[Math.floor(Math.random() * FAKE_MSGS.length)]);
  if (k) vote(k, who);
}, 350);
function startBoss() {
  if (boss && !boss.defeated && !s.over) return;
  if (!running || s.over) { s = Logic.newState(); running = true; saved = false; prevLevel = 1; runBase = best; recordFired = false; lastRank = 0; renderBoard(); }
  s.enemies = []; s.bombs = []; boss = Boss.newBoss();
  document.body.classList.add('bossmode'); bossEl.classList.add('on');
  SFX.start(); celebrate(1);
}
function endBoss() { document.body.classList.remove('bossmode'); bossEl.classList.remove('on'); if (!s.over) { s.enemies = Logic.makeWave(s.level); s.dir = 1; } boss = null; }
function drawBoss() {
  const b = boss, cx = b.x + b.w / 2;
  g.save();
  if (!b.defeated) {
    g.shadowColor = '#ff4d6d'; g.shadowBlur = 25; g.fillStyle = b.hurt > 0 ? '#fff' : (b.phase === 'attack' ? '#ff2d55' : '#8e44ad');
    g.fillRect(b.x, b.y + 20, b.w, b.h - 20); g.fillRect(b.x + 20, b.y, b.w - 40, 30);
    g.fillRect(b.x - 18, b.y + 40, 18, 50); g.fillRect(b.x + b.w, b.y + 40, 18, 50);
    g.shadowBlur = 0; g.fillStyle = '#000'; g.fillRect(cx - 55, b.y + 38, 34, 22); g.fillRect(cx + 21, b.y + 38, 34, 22);
    g.fillStyle = b.phase === 'attack' ? '#ffd23f' : '#00e5ff'; g.fillRect(cx - 45 + Math.sin(b.t * 5) * 6, b.y + 44, 12, 10); g.fillRect(cx + 31 + Math.sin(b.t * 5) * 6, b.y + 44, 12, 10);
    g.fillStyle = '#000'; for (let i = 0; i < 6; i++) g.fillRect(b.x + 40 + i * 24, b.y + 78, 12, 14);
  }
  b.shots.forEach(o => {
    if (o.type === 'beam') {
      if (o.warn > 0) { g.fillStyle = `rgba(255,255,80,${0.12 + 0.12 * Math.sin(b.t * 40)})`; g.fillRect(o.x + 12, o.y, 12, o.h); }
      else { g.shadowColor = '#00e5ff'; g.shadowBlur = 25; g.fillStyle = '#fff'; g.fillRect(o.x, o.y, o.w, o.h); g.fillStyle = '#00e5ff88'; g.fillRect(o.x - 6, o.y, o.w + 12, o.h); g.shadowBlur = 0; }
    } else if (o.type === 'meteor') { g.fillStyle = '#ff9f43'; g.shadowColor = '#ff4d6d'; g.shadowBlur = 14; g.fillRect(o.x, o.y, o.w, o.h); }
    else { g.fillStyle = '#ff6bd6'; g.shadowColor = '#ff6bd6'; g.shadowBlur = 12; g.fillRect(o.x, o.y, o.w, o.h); }
  });
  g.shadowBlur = 0; g.fillStyle = '#fff'; b.bullets.forEach(u => g.fillRect(u.x, u.y, u.w, u.h));
  g.restore();
  // barre de vie
  g.fillStyle = '#300'; g.fillRect(40, 56, 400, 8); g.fillStyle = '#ff4d6d'; g.fillRect(40, 56, 400 * b.hp / b.max, 8);
  g.textAlign = 'center'; g.font = 'bold 14px monospace'; g.fillStyle = '#ffd23f';
  g.fillText(b.phase === 'vote' ? `LE CHAT VOTE ! ${Math.ceil(b.timer)}s (touches 1-4)` : `⚠ ${Boss.ATTACKS.find(a => a.key === b.attack).label} ⚠`, 240, 48);
  const tot = Math.max(1, Object.values(b.votes).reduce((x, y) => x + y, 0));
  bossEl.querySelectorAll('button').forEach(btn => { const v = b.votes[btn.dataset.k]; btn.querySelector('.n').textContent = v + ' vote' + (v > 1 ? 's' : ''); btn.querySelector('i').style.width = (100 * v / tot) + '%'; btn.style.opacity = b.phase === 'vote' ? 1 : (btn.dataset.k === b.attack || b.attack === 'chaos' ? 1 : .35); });
}
const pseudoEl = document.getElementById('pseudo'), boardEl = document.getElementById('board'), defiEl = document.getElementById('defi');
let board = Logic.loadBoard(localStorage), lastRank = 0, saved = false;
try { pseudoEl.value = localStorage.getItem('astro-pseudo') || ''; } catch (e) {}
pseudoEl.addEventListener('change', () => { try { localStorage.setItem('astro-pseudo', Logic.cleanName(pseudoEl.value)); } catch (e) {} });
function esc(x) { return String(x).replace(/[&<>"]/g, c => '&#' + c.charCodeAt(0) + ';'); }
function renderBoard() {
  boardEl.innerHTML = board.length ? board.map((e, i) => `<tr class="${i + 1 === lastRank ? 'me' : ''}"><td>${i + 1}.</td><td>${esc(e.name)}</td><td>niv ${e.level}</td><td>${e.score}</td></tr>`).join('')
    : '<tr><td>Aucun score pour l\'instant — sois le premier !</td></tr>';
}
const challenge = Logic.parseChallenge(location.hash);
if (challenge) { defiEl.style.display = 'block'; defiEl.textContent = `⚔ ${challenge.name} te défie : bats ${challenge.score} points !`; }
document.getElementById('share').addEventListener('click', () => {
  const sc = Math.max(best, board.length ? board[0].score : 0), name = pseudoEl.value;
  const url = location.href.split('#')[0] + Logic.challengeHash(name, sc);
  const msg = `Je te défie sur Astro Arcade : bats mes ${sc} points ! ${url}`;
  (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(() => alert('Défi copié !'), () => prompt('Copie ton défi :', msg));
});
function submitScore() {
  if (saved) return; saved = true;
  if (s.score <= 0) return;
  const r = Logic.addScore(board, pseudoEl.value, s.score, s.level);
  board = r.board; lastRank = r.rank; Logic.saveBoard(localStorage, board); renderBoard();
}
renderBoard();
addEventListener('keydown', e => {
  if (e.target === pseudoEl) return;
  keys[e.code] = true;
  if (konami(e.code)) startBoss();
  if (boss && /^Digit[1-4]$/.test(e.code)) vote(Boss.ATTACKS[+e.code.slice(5) - 1].key, 'toi');
  if (e.code === 'Enter' && (!running || s.over)) { s = Logic.newState(); running = true; saved = false; prevLevel = 1; runBase = best; recordFired = false; lastRank = 0; renderBoard(); }
  if (['Space','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => (keys[e.code] = false));
cv.addEventListener('touchstart', e => { keys.Touch = true; if (!running || s.over) { s = Logic.newState(); running = true; saved = false; prevLevel = 1; runBase = best; recordFired = false; lastRank = 0; renderBoard(); } });
cv.addEventListener('touchmove', e => { const r = cv.getBoundingClientRect(); s.player.x = (e.touches[0].clientX - r.left) / r.width * 480 - 16; e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend', () => (keys.Touch = false));

function text(t, x, y, size, color) { g.fillStyle = color || '#fff'; g.font = `bold ${size}px monospace`; g.textAlign = 'center'; g.fillText(t, x, y); }
let autoplay = false, idle = 0;
window.setAutoplay = function (on) { autoplay = !!on; idle = 0; document.getElementById('demo').style.display = autoplay ? 'block' : 'none'; };
function newGame() { s = Logic.newState(); running = true; saved = false; prevLevel = 1; runBase = best; recordFired = false; lastRank = 0; renderBoard(); }
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  const inp = {
    left: +!!(keys.ArrowLeft || keys.KeyA || keys.KeyQ), right: +!!(keys.ArrowRight || keys.KeyD),
    fire: !!(keys.Space || keys.Touch) };
  if (autoplay) {
    if (running && !s.over) { Object.assign(inp, Ai.decide(s, boss)); idle = 0; }
    else if (Ai.shouldRestart(running, s.over, idle += dt)) { idle = 0; newGame(); }
  }
  if (boss) {
    if (running) { Boss.step(boss, s, dt, inp); boss.events.forEach(ev => SFX[ev] && SFX[ev]()); }
    if (boss.events.includes('win')) { celebrate(2); setTimeout(() => boss && endBoss(), 3500); }
    if (s.over) endBoss();
  } else if (running) Logic.step(s, dt, inp);
  if (s.level > prevLevel) celebrate(1);
  prevLevel = s.level;
  if (runBase > 0 && !recordFired && s.score > runBase) { recordFired = true; celebrate(2); }
  if (s.over && runBase === 0 && !recordFired && s.score > 0) { recordFired = true; celebrate(2); }
  if (s.over) submitScore();
  if (s.over && s.score > best) { best = s.score; try { localStorage.setItem('astro-best', best); } catch (e) {} }
  g.save(); g.clearRect(0, 0, 480, 640);
  if (s.shake > 0) g.translate((Math.random()-.5)*10, (Math.random()-.5)*10);
  g.fillStyle = '#fff'; stars.forEach(st => { st.y = (st.y + st.v*dt) % 640; g.fillRect(st.x, st.y, 2, 2); });
  const rowColors = ['#ff4d6d','#ff9f43','#ffd23f','#2ed573','#1e90ff','#a55eea'];
  s.enemies.forEach(e => { g.fillStyle = rowColors[e.row % 6]; g.shadowColor = g.fillStyle; g.shadowBlur = 10;
    g.fillRect(e.x, e.y, e.w, e.h); g.fillStyle = '#000'; g.fillRect(e.x+6, e.y+6, 4, 4); g.fillRect(e.x+18, e.y+6, 4, 4); });
  g.shadowColor = '#00e5ff'; g.shadowBlur = 12; g.fillStyle = '#00e5ff';
  const p = s.player; g.beginPath(); g.moveTo(p.x+p.w/2, p.y); g.lineTo(p.x+p.w, p.y+p.h); g.lineTo(p.x, p.y+p.h); g.fill();
  g.fillStyle = '#fff'; s.bullets.forEach(b => g.fillRect(b.x, b.y, b.w, b.h));
  g.fillStyle = '#ff4d6d'; s.bombs.forEach(b => g.fillRect(b.x, b.y, b.w, b.h));
  s.particles.forEach(q => { g.globalAlpha = Math.max(0, q.life/0.6); g.fillStyle = q.color; g.fillRect(q.x, q.y, 3, 3); });
  g.globalAlpha = 1; g.shadowBlur = 0;
  if (boss) drawBoss();
  g.restore();
  g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = '16px monospace';
  g.fillText('SCORE ' + s.score, 10, 22); g.fillText('NIV ' + s.level, 200, 22);
  g.textAlign = 'right'; g.fillText('♥'.repeat(Math.max(0, s.lives)), 470, 22);
  if (s.combo > 2) text('COMBO x' + s.combo, 240, 620, 18, '#ffd23f');
  g.textAlign = 'left'; g.fillStyle = '#888'; g.fillText('RECORD ' + best, 10, 42);
  if (boss && boss.defeated) text('BOSS VAINCU ! +5000', 240, 300, 34, '#2ed573');
  if (s.flash) text(s.flash, 240, 300, 40, '#ffd23f');
  if (!running) { text('ASTRO ARCADE', 240, 280, 36, '#ffd23f'); text('Appuie sur Entrée', 240, 330, 20); }
  if (s.over) { text('GAME OVER', 240, 280, 44, '#ff4d6d'); text('Score : ' + s.score, 240, 325, 22); if (lastRank) text('Classement : #' + lastRank + ' (' + Logic.cleanName(pseudoEl.value) + ')', 240, 350, 16, '#00e5ff'); text('Entrée pour rejouer', 240, 385, 18); }
  Logic.stepFx(fx, dt, fxCv.height); drawFx();
  if (recordFired) { g.textAlign = 'center'; text('🎆 NOUVEAU RECORD ! 🎆', 240, 70, 20, '#ffd23f'); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
