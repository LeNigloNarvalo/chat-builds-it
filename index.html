<script>

let prevLevel = 1, runBase = best, recordFired = false;
function fxResize() { fxCv.width = innerWidth; fxCv.height = innerHeight; }
addEventListener('resize', fxResize); fxResize();

function drawFx() {
  fg.clearRect(0, 0, fxCv.width, fxCv.height);

  fx.sparks.forEach(p => { fg.globalAlpha = Math.max(0, Math.min(1, p.life / 0.8)); fg.fillStyle = p.color; fg.fillRect(p.x - 2.5, p.y - 2.5, 5, 5); });

// --- Mode Boss Secret : Konami Code -> boss géant, le chat vote ses attaques ---
let boss = null; const konami = Boss.konamiTracker();
let actx = null;

function jingle(notes) { notes.forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.05), i * 110)); }
const SFX = {
  start: () => jingle([262, 330, 392, 523, 392, 523, 659, 784]),
  shoot: () => beep(880, 0.08, 'square', 0.025, 300),
  'boss-hit': () => beep(160, 0.1, 'sawtooth', 0.05, 60),
  hit: () => beep(220, 0.35, 'sawtooth', 0.08, 40),
  laser: () => beep(1200, 0.5, 'square', 0.04, 90),

  'vote-start': () => jingle([523, 659]),

const bossEl = document.getElementById('boss');

buildBossUi();

// Faux "chat Twitch" : des spectateurs virtuels votent en direct (le vrai chat peut aussi cliquer / taper 1-4).
const FAKE_VIEWERS = ['kevin_42', 'LaMouette', 'xX_Pixel_Xx', 'Zoé', 'MrBaguette', 'Tonton_Dev', 'neko', 'GigaChad', 'Lulu', 'ArcadeFan'];

setInterval(() => {
  if (!boss || boss.defeated || boss.phase !== 'vote') return;
  const who = FAKE_VIEWERS[Math.floor(Math.random() * FAKE_VIEWERS.length)];

function endBoss() { document.body.classList.remove('bossmode'); bossEl.classList.remove('on'); if (!s.over) { s.enemies = Logic.makeWave(s.level); s.dir = 1; } boss = null; }
function drawBoss() {
  const b = boss, cx = b.x + b.w / 2;

    g.shadowColor = '#ff4d6d'; g.shadowBlur = 25; g.fillStyle = b.hurt > 0 ? '#fff' : (b.phase === 'attack' ? '#ff2d55' : '#8e44ad');

    g.fillRect(b.x - 18, b.y + 40, 18, 50); g.fillRect(b.x + b.w, b.y + 40, 18, 50);
    g.shadowBlur = 0; g.fillStyle = '#000'; g.fillRect(cx - 55, b.y + 38, 34, 22); g.fillRect(cx + 21, b.y + 38, 34, 22);
    g.fillStyle = b.phase === 'attack' ? '#ffd23f' : '#00e5ff'; g.fillRect(cx - 45 + Math.sin(b.t * 5) * 6, b.y + 44, 12, 10); g.fillRect(cx + 31 + Math.sin(b.t * 5) * 6, b.y + 44, 12, 10);
    g.fillStyle = '#000'; for (let i = 0; i < 6; i++) g.fillRect(b.x + 40 + i * 24, b.y + 78, 12, 14);
  }
  b.shots.forEach(o => {
    if (o.type === 'beam') {
      if (o.warn > 0) { g.fillStyle = `rgba(255,255,80,${0.12 + 0.12 * Math.sin(b.t * 40)})`; g.fillRect(o.x + 12, o.y, 12, o.h); }
      else { g.shadowColor = '#00e5ff'; g.shadowBlur = 25; g.fillStyle = '#fff'; g.fillRect(o.x, o.y, o.w, o.h); g.fillStyle = '#00e5ff88'; g.fillRect(o.x - 6, o.y, o.w + 12, o.h); g.shadowBlur = 0; }
    } else if (o.type === 'meteor') { g.fillStyle = '#ff9f43'; g.shadowColor = '#ff4d6d'; g.shadowBlur = 14; g.fillRect(o.x, o.y, o.w, o.h); }
    else { g.fillStyle = '#ff6bd6'; g.shadowColor = '#ff6bd6'; g.shadowBlur = 12; g.fillRect(o.x, o.y, o.w, o.h); }
  });
  g.shadowBlur = 0; g.fillStyle = '#fff'; b.bullets.forEach(u => g.fillRect(u.x, u.y, u.w, u.h));

  g.fillStyle = '#300'; g.fillRect(40, 56, 400, 8); g.fillStyle = '#ff4d6d'; g.fillRect(40, 56, 400 * b.hp / b.max, 8);
  g.textAlign = 'center'; g.font = 'bold 14px monospace'; g.fillStyle = '#ffd23f';
  g.fillText(b.phase === 'vote' ? `LE CHAT VOTE ! ${Math.ceil(b.timer)}s (touches 1-4)` : `⚠ ${Boss.ATTACKS.find(a => a.key === b.attack).label} ⚠`, 240, 48);

}
const pseudoEl = document.getElementById('pseudo'), boardEl = document.getElementById('board'), defiEl = document.getElementById('defi');
let board = Logic.loadBoard(localStorage), lastRank = 0, saved = false;
try { pseudoEl.value = localStorage.getItem('astro-pseudo') || ''; } catch (e) {}
pseudoEl.addEventListener('change', () => { try { localStorage.setItem('astro-pseudo', Logic.cleanName(pseudoEl.value)); } catch (e) {} });
function esc(x) { return String(x).replace(/[&<>"]/g, c => '&#' + c.charCodeAt(0) + ';'); }
function renderBoard() {
  boardEl.innerHTML = board.length ? board.map((e, i) => `<tr class="${i + 1 === lastRank ? 'me' : ''}"><td>${i + 1}.</td><td>${esc(e.name)}</td><td>niv ${e.level}</td><td>${e.score}</td></tr>`).join('')
    : '<tr><td>Aucun score pour l\'instant — sois le premier !</td></tr>';
}
const challenge = Logic.parseChallenge(location.hash);
if (challenge) { defiEl.style.display = 'block'; defiEl.textContent = `⚔ ${challenge.name} te défie : bats ${challenge.score} points !`; }
document.getElementById('share').addEventListener('click', () => {
  const sc = Math.max(best, board.length ? board[0].score : 0), name = pseudoEl.value;
  const url = location.href.split('#')[0] + Logic.challengeHash(name, sc);

  (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(() => alert('Défi copié !'), () => prompt('Copie ton défi :', msg));
});
function submitScore() {
  if (saved) return; saved = true;
  if (s.score <= 0) return;

  board = r.board; lastRank = r.rank; Logic.saveBoard(localStorage, board); renderBoard();

renderBoard();
// code secret : clic sur le titre -> champ + pavé (les flèches servent déjà à jouer, on peut donc le saisir ici)
const secretEl = document.getElementById('secret'), scEl = document.getElementById('sc'), scn = document.getElementById('scn');
let kProg = 0;
function secretCode(c) { kProg = c === Boss.KONAMI[kProg] ? kProg + 1 : (c === Boss.KONAMI[0] ? 1 : 0); scn.textContent = kProg ? kProg + ' / ' + Boss.KONAMI.length : ''; if (konami(c)) { kProg = 0; scn.textContent = ''; secretEl.hidden = true; startBoss(); } }
document.querySelector('h1').addEventListener('click', () => { secretEl.hidden = !secretEl.hidden; if (!secretEl.hidden) scEl.focus(); });
secretEl.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => secretCode(b.dataset.c)));
scEl.addEventListener('input', () => {
  const v = scEl.value.toLowerCase().replace(/[\s,;\-_.]+/g, '');

});
addEventListener('keydown', e => {

addEventListener('keyup', e => (keys[e.code] = false));
cv.addEventListener('touchstart', e => { keys.Touch = true; if (!running || s.over) { rec = Replay.newRecorder(); recDone = false; s = Logic.newState(); running = true; saved = false; prevLevel = 1; runBase = best; recordFired = false; lastRank = 0; renderBoard(); } });

function text(t, x, y, size, color) { g.fillStyle = color || '#fff'; g.font = `bold ${size}px monospace`; g.textAlign = 'center'; g.fillText(t, x, y); }
// --- Replay du Chat : meilleure partie en ralenti + zoom sur les exploits, lien et vidéo à partager ---
let rec = Replay.newRecorder(), bestRun = null, recDone = false;
const rpEl = document.getElementById('rp'), rc = document.getElementById('rc'), rg = rc.getContext('2d'), rpInfo = document.getElementById('rp-info');
let play = null, mediaRec = null;
function frameDt(p) { return p.step; }
function openReplay(frames, step, title) {

}
function playTick(now) {

function stopVideo() { if (mediaRec) { const m = mediaRec; mediaRec = null; m.stop(); } }
function recordVideo() {

  mediaRec.ondataavailable = e => e.data.size && chunks.push(e.data);
  mediaRec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'replay-astro-arcade.webm'; a.click(); rpInfo.textContent = 'Vidéo enregistrée ! Envoie le fichier .webm à tes potes.'; };
  play.idx = 0; play.hold = 0; mediaRec.start(); rpInfo.textContent = '⏺ Enregistrement en cours (une boucle)…';

const b64 = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = t => Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

  if (!play) return;

}
